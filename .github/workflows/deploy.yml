name: Deploy OpaqueCredit to Sepolia

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true
        default: ''

jobs:
  deploy:
    name: Deploy Smart Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate deploy confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY" ]; then
            echo "❌ You must type DEPLOY in the confirmation field."
            exit 1
          fi
          echo "✅ Deploy confirmed."

      - name: Install dependencies
        run: npm install

      - name: Compile contract
        run: npx hardhat compile

      - name: Check compilation result
        run: |
          if [ -d "artifacts/contracts/OpaqueCredit.sol" ]; then
            echo "✅ Contract compiled successfully."
          else
            echo "❌ Compilation failed — artifact not found."
            exit 1
          fi

      - name: Deploy to Sepolia
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          INFURA_API_KEY: ${{ secrets.INFURA_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: npx hardhat run scripts/deploy.ts --network sepolia

      - name: Deployment complete
        run: |
          echo "══════════════════════════════════════════"
          echo "  Deployment finished. Check logs above"
          echo "  for your CONTRACT_ADDRESS."
          echo "  Copy it and paste into index.html."
          echo "══════════════════════════════════════════"
